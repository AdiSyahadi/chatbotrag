<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chatbot Desa{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-robot"></i>
                <span>Chatbot Desa</span>
            </div>
            <ul class="sidebar-nav">
                <li>
                    <a href="/" class="{% if active_page == 'chat' %}active{% endif %}">
                        <i class="bi bi-chat-dots"></i>
                        <span>Chat</span>
                    </a>
                </li>
                <li>
                    <a href="/upload" class="{% if active_page == 'upload' %}active{% endif %}">
                        <i class="bi bi-cloud-upload"></i>
                        <span>Upload</span>
                    </a>
                </li>
                <li>
                    <a href="/documents" class="{% if active_page == 'documents' %}active{% endif %}">
                        <i class="bi bi-folder2-open"></i>
                        <span>Dokumen</span>
                    </a>
                </li>
                <li>
                    <a href="/settings" class="{% if active_page == 'settings' %}active{% endif %}">
                        <i class="bi bi-gear"></i>
                        <span>Pengaturan</span>
                    </a>
                </li>
                <li>
                    <a href="/system-prompt" class="{% if active_page == 'system-prompt' %}active{% endif %}">
                        <i class="bi bi-cpu"></i>
                        <span>System Prompt</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/dashboard" class="{% if active_page == 'admin_dashboard' %}active{% endif %}">
                        <i class="bi bi-headset"></i>
                        <span>Live Chat</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/reviews" class="{% if active_page == 'admin_reviews' %}active{% endif %}">
                        <i class="bi bi-star"></i>
                        <span>Ulasan Warga</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/evaluasi" class="{% if active_page == 'admin_evaluasi' %}active{% endif %}">
                        <i class="bi bi-graph-up-arrow"></i>
                        <span>Evaluasi AI</span>
                    </a>
                </li>
                <li>
                    <a href="/embed" class="{% if active_page == 'embed' %}active{% endif %}">
                        <i class="bi bi-code-square"></i>
                        <span>Embed</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                DesaAI + DeepSeek v1.0
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar" id="appTopbar" style="display: none;">
                <div class="topbar-right">
                    <div class="dropdown">
                        <button class="btn-user-menu" onclick="toggleUserMenu()">
                            <i class="bi bi-person-circle"></i> <span>My Account</span> <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="userDropdown">
                            <a href="#" onclick="performLogout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Global logic for Topbar and Logout
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            const topbar = document.getElementById('appTopbar');
            if (topbar) topbar.style.display = 'flex';
        });

        function toggleUserMenu() {
            const menu = document.getElementById('userDropdown');
            menu.classList.toggle('show');
        }

        // Close dropdown if clicked outside
        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function performLogout() {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
